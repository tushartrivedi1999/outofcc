[project]
name = "opensearch-platform"
version = "0.2.0"
description = "High-performance API-first search platform with authentication portal, SDK, and Searx integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
