<!doctype html>
<html>
<head><meta charset="utf-8"><title>Agent Context Studio</title></head>
<body>
  <h1>Agent Context Studio</h1>
  <p><a href="/dashboard">Back to dashboard</a></p>

  <h2>Generate Tavily-like structured context</h2>
  <form method="post" action="/agent/search">
    <label>Query <input name="query" required></label>
    <label>Top K <input type="number" name="top_k" value="8" min="1" max="20"></label>
    <button type="submit">Generate context</button>
  </form>
  <p>${message}</p>
  <pre>${context_json}</pre>

  <h2>Dataset creation</h2>
  <form method="post" action="/agent/datasets/create">
    <label>Name <input name="name" required></label>
    <label>Query <input name="query" required></label>
    <label>Source
      <select name="source">
        <option value="open-search">open-search</option>
        <option value="commoncrawl">commoncrawl</option>
      </select>
    </label>
    <label>Rows <input type="number" name="rows" value="100" min="10" max="5000"></label>
    <button type="submit">Create dataset</button>
  </form>

  <h2>Your datasets</h2>
  <table border="1" cellpadding="6" cellspacing="0">
    <thead><tr><th>Name</th><th>Source</th><th>Query</th><th>Rows</th><th>Status</th><th>Created</th></tr></thead>
    <tbody>${datasets_rows}</tbody>
  </table>
</body>
</html>
