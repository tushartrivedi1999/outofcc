<!doctype html>
<html>
<head><meta charset="utf-8"><title>Verify Site</title></head>
<body>
  <h1>Verify property: ${domain}</h1>
  <p><a href="/console">Back to properties</a></p>
  <p>${message}</p>

  <h2>DNS verification</h2>
  <p>Add TXT record to your DNS:</p>
  <pre>${dns_txt}</pre>

  <h2>URL prefix file verification</h2>
  <p>Create this file at your site root:</p>
  <pre>${html_file}</pre>
  <p>With body:</p>
  <pre>${html_token}</pre>

  <h3>Complete verification</h3>
  <form method="post" action="/console/site/${site_id}/verify">
    <label>Method
      <select name="method">
        <option value="dns">dns</option>
        <option value="url-prefix">url-prefix</option>
      </select>
    </label>
    <label>Verification token <input name="token_input" required></label>
    <button type="submit">Verify now</button>
  </form>
</body>
</html>
